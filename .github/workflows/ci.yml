name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint (Go + Python)
        run: make lint

      - name: Unit tests (Go + Python)
        run: make test

      # docs/BACKEND_BUILD_STEPS.md Step 41 — the Filler Agent's
      # integration tests drive a real headless Chromium against the
      # ats-fixtures forms. --with-deps needs the runner's sudo access
      # this CI environment has (unlike some sandboxed dev environments).
      - name: Install Playwright browser
        working-directory: backend/agents
        run: uv run playwright install --with-deps chromium

      # docs/BACKEND_BUILD_STEPS.md Step 7 / M0 exit — real Docker Redis
      # container + a real Python subprocess, not mocks on either side.
      # ubuntu-latest ships Docker pre-installed, same as local dev.
      - name: Integration test — cross-language message bus round trip
        run: make test-integration
