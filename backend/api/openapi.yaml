openapi: 3.0.3
info:
  title: AgentOS API
  version: "1.0"
  description: >
    REST contract between the React frontend and the Go control plane.
    Human-readable companion: ../../docs/API_REFERENCE.md — read that first for
    rationale; this file is the machine-readable source of truth for codegen,
    Postman/Swagger import, and contract testing.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/UserSummary" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: Log out (invalidate current token)
      responses:
        "200": { description: OK }

  /auth/session:
    get:
      summary: Check current session validity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/UserSummary" }
        "401": { $ref: "#/components/responses/Error" }

  /applications:
    post:
      summary: Submit a JD manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jd_url: { type: string, format: uri }
                jd_text: { type: string }
              description: Exactly one of jd_url or jd_text is required.
      responses:
        "202":
          description: Accepted, processing started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationCreated" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      summary: List applications for the current user
      parameters:
        - in: query
          name: status
          schema: { type: array, items: { $ref: "#/components/schemas/ApplicationStatus" } }
          style: form
          explode: true
        - in: query
          name: source
          schema: { type: string, enum: [manual, discovered] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApplicationSummary" }
                  next_cursor: { type: string, nullable: true }

  /applications/bulk-confirm-submit:
    post:
      summary: Bulk-approve applications in the high-confidence review band
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK — check per-item results, partial failure is expected
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string }
                        error: { type: string, nullable: true }

  /applications/{id}:
    get:
      summary: Full application detail
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /applications/{id}/confirm-submit:
    post:
      summary: Confirm a single ready_for_review application
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  submitted_at: { type: string, format: date-time, nullable: true }
        "409": { $ref: "#/components/responses/Error" }

  /applications/{id}/resolve-input:
    post:
      summary: Answer flagged fields for a needs_input application
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }

  /applications/{id}/outcome:
    patch:
      summary: User-supplied outcome update
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [interview, rejected, no_response] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  outcome: { type: string }

  /profile:
    get:
      summary: Get the current user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      summary: Update profile (triggers re-chunking/re-embedding)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "202":
          description: Accepted, reindexing in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  reindexing: { type: boolean }

  /profile/resume:
    post:
      summary: Upload a new base resume file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Accepted, reindexing in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_resume_doc_id: { type: string }
                  reindexing: { type: boolean }

  /search-criteria:
    get:
      summary: Get shared ingestion config (ATS platforms, exclusions) — applies to every search profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchCriteria" }
    put:
      summary: Update shared ingestion config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCriteria" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchCriteria" }

  /search-profiles:
    get:
      summary: List this user's search profiles (max 3 active — TDD §3.1.1)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SearchProfile" }
    post:
      summary: Create a new search profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchProfileFacets" }
      responses:
        "201":
          description: Created — includes compiled_query_text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchProfile" }
        "409": { $ref: "#/components/responses/Error" }

  /search-profiles/{id}:
    put:
      summary: Update a search profile (server recompiles the query)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchProfileFacets" }
      responses:
        "200":
          description: OK — includes the recompiled compiled_query_text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchProfile" }
    delete:
      summary: Remove a search profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /search-profiles/preview:
    post:
      summary: Compile a profile's facets into a query string without saving (live preview; no id needed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchProfileFacets" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  compiled_query_text: { type: string }
                  estimated_length_chars: { type: integer }
                  within_length_limit: { type: boolean }

  /policy/thresholds:
    get:
      summary: Read-only Policy Engine thresholds the UI needs to render (e.g. confidence bands)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  min_generate_score: { type: integer }
                  min_autosubmit_score: { type: integer }

  /eval/latest:
    get:
      summary: Latest evaluation harness results (admin/debug)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_type: { type: string }
                  dataset_version: { type: string }
                  completed_at: { type: string, format: date-time }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        metric_name: { type: string }
                        value: { type: number }

  /mlops/models:
    get:
      summary: List model versions and their MLflow stage (admin/debug)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        mlflow_model_name: { type: string }
                        mlflow_version: { type: integer }
                        current_stage: { type: string, enum: [None, Staging, Production, Archived] }
                        promoted_at: { type: string, format: date-time, nullable: true }
                        eval_metrics: { type: object }

  /mlops/drift:
    get:
      summary: Recent drift checks (admin/debug)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        checked_at: { type: string, format: date-time }
                        metric_name: { type: string }
                        value: { type: number }
                        baseline_value: { type: number }
                        breached: { type: boolean }

  /mlops/models/{id}/approve:
    post:
      summary: Human approval step to promote a candidate model to Production
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  current_stage: { type: string }
                  promoted_at: { type: string, format: date-time }
                  promoted_by: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ApplicationId:
      in: path
      name: id
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }

  schemas:
    ApplicationStatus:
      type: string
      enum: [pending, scored, below_threshold, filling, ready_for_review, needs_input, submitted, failed]

    UserSummary:
      type: object
      properties:
        id: { type: string }
        email: { type: string }

    ApplicationCreated:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }

    ApplicationSummary:
      type: object
      properties:
        id: { type: string }
        company: { type: string }
        role_title: { type: string }
        source: { type: string, enum: [manual, discovered] }
        search_profile_id: { type: string, nullable: true, description: "Null for manual-source applications." }
        search_profile_name: { type: string, nullable: true }
        jd_fit_score: { type: integer }
        resume_match_score: { type: integer }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        bot_check_detected: { type: boolean }
        submitted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationSummary"
        - type: object
          properties:
            jd_url: { type: string, nullable: true }
            score_breakdown:
              type: object
              nullable: true
              description: Null until the Scoring Agent has scored this application.
              properties:
                score: { type: integer }
                scoring_model_version: { type: string }
                signals:
                  type: object
                  description: "Keyed by signal name: keyword_overlap, retrieval_relevance, llm_semantic."
                  additionalProperties:
                    type: object
                    properties:
                      value: { type: number }
                      weight: { type: number }
                      contribution: { type: number }
            retrieved_evidence:
              type: array
              items:
                type: object
                properties:
                  chunk_id: { type: string }
                  text: { type: string }
                  similarity: { type: number }
            generated_documents:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  type: { type: string, enum: [resume, cover_letter, screener_answer] }
                  storage_ref: { type: string }
                  source_chunk_ids: { type: array, items: { type: string } }
                  groundedness_score: { type: number }
            policy_decisions:
              type: array
              items:
                type: object
                properties:
                  decision_point: { type: string }
                  action: { type: string }
                  reasons: { type: array, items: { type: string } }
                  created_at: { type: string, format: date-time }
            outcome: { type: string, nullable: true, enum: [interview, rejected, no_response, null] }
            updated_at: { type: string, format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string }
        base_resume_doc_id: { type: string }
        skills: { type: array, items: { type: string } }
        experience:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              company: { type: string }
              title: { type: string }
              start_date: { type: string }
              end_date: { type: string, nullable: true }
              bullets: { type: array, items: { type: string } }

    SearchCriteria:
      type: object
      description: >
        Shared ingestion config (one per user) — applies to every search profile.
        Split from SearchProfile specifically to avoid role×skill cross-pollination;
        see TDD §3.1.1.
      properties:
        ats_domain_allowlist: { type: array, items: { type: string }, example: ["greenhouse.io", "lever.co"] }
        exclusion_terms:
          type: array
          items: { type: string }
          example: ["staffing agency", "intern", "contract to hire"]
          description: Rendered as -"term" in every profile's compiled query. Defaults to a suggested set; user-editable.

    SearchProfileFacets:
      type: object
      description: >
        Per-track facets (TDD §3.1.1) — one search profile is one role/skill/location
        combination, e.g. "AI Engineer track". Max 3 active profiles per user.
      properties:
        name: { type: string, example: "AI Engineer track" }
        role_titles: { type: array, items: { type: string }, example: ["senior AI engineer", "AI/ML engineer"] }
        title_scoped:
          type: boolean
          default: true
          description: Whether role_titles are wrapped in intitle:(...) for precision, vs. a bare keyword match.
        skill_keywords: { type: array, items: { type: string }, example: ["LLM", "LangChain", "Python"] }
        locations: { type: array, items: { type: string }, example: ["remote", "Bangalore"] }

    SearchProfile:
      allOf:
        - $ref: "#/components/schemas/SearchProfileFacets"
        - type: object
          properties:
            id: { type: string }
            compiled_query_text:
              type: string
              description: >
                Server-computed, includes this profile's facets plus the shared
                SearchCriteria (platform/exclusions). Never write to this field directly.
            compiled_at: { type: string, format: date-time }
            active: { type: boolean }
